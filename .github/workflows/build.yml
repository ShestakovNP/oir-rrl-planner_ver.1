# Builds the macOS (.dmg, universal Intel + Apple Silicon) and Windows (.msi + .exe)
# installers on GitHub's machines. Run it from the "Actions" tab ("Run workflow").
#
# Every run is a numbered build: the app version becomes 1.0.<run number>, the installers and
# the signed update files (.sig, latest.json) go to the GitHub Release "build-<run number>",
# which is published as the latest one when both systems built. The app's «Обновить приложение»
# installs it from there and checks the signature with the public key in tauri.conf.json.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           — contents of the private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password
name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15-intel' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Version 1.0.${{ github.run_number }}
        run: npm pkg set version=1.0.${{ github.run_number }}

      - name: Install dependencies
        run: npm install

      - name: Calculation tests
        run: npm test

      - name: Build app and upload to the release draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: build-${{ github.run_number }}
          releaseName: Сборка №${{ github.run_number }}
          releaseBody: 'Установщики ОИР RRL Planner: .dmg — macOS, .exe или .msi — Windows. Установленная программа обновляется сама: меню с луной → «Обновить приложение».'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: oir-rrl-planner-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release as the latest one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "build-${{ github.run_number }}" --repo "${{ github.repository }}" --draft=false --latest
          gh release view "build-${{ github.run_number }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
