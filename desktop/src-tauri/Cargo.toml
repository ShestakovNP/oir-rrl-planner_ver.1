[package]
name = "oir-rrl-planner"
version = "1.0.0"
description = "ОИР RRL Planner — расчёт пролётов РРЛ"
authors = ["ОИР — Отдел инфраструктурных решений"]
edition = "2021"

[lib]
name = "oir_rrl_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# unsafe-headers: allows sending our own User-Agent, which the OSM tile,
# Nominatim and OpenTopoData usage policies require.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
